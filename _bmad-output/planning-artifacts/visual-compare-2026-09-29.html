<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾刻 · 视觉方案对比（交互演示）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(255,170,80,.35), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(90,60,180,.5), transparent 55%),
      linear-gradient(135deg, #0f2027 0%, #203a43 45%, #2c5364 100%);
  }

  /* ============ 模拟 macOS 菜单栏 ============ */
  .menubar {
    position:fixed; top:0; left:0; right:0; height:26px; z-index:50;
    background:rgba(20,20,22,.72); backdrop-filter:blur(20px);
    display:flex; align-items:center; padding:0 14px; gap:18px;
    color:#e8e8ea; font-size:12.5px;
  }
  .menubar .mb-right { margin-left:auto; display:flex; gap:14px; align-items:center; color:#d5d5d8; }
  .mb-shike { display:flex; align-items:center; gap:5px; font-weight:600; }
  .mb-shike .icn { width:14px; height:14px; }
  .mb-count {
    background:#ff7a1a; color:#fff; border-radius:8px; font-size:10px; font-weight:700;
    padding:0 5px; line-height:15px; display:none;
  }
  .mb-count.on { display:inline-block; }

  /* ============ 顶部版本切换 ============ */
  .tabs {
    position:fixed; top:44px; left:50%; transform:translateX(-50%); z-index:60;
    display:flex; gap:8px; align-items:center;
    background:rgba(18,18,20,.55); backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:8px 10px;
  }
  .tab {
    border:none; cursor:pointer; border-radius:9px; padding:7px 14px;
    background:transparent; color:rgba(255,255,255,.72); font-size:13px; font-weight:600;
    transition:background .15s, color .15s;
  }
  .tab:hover { background:rgba(255,255,255,.1); color:#fff; }
  .tab.active { background:#fff; color:#111; }
  .tabdesc {
    position:fixed; bottom:52px; left:50%; transform:translateX(-50%); z-index:60;
    color:rgba(255,255,255,.88); font-size:12.5px; text-align:center; max-width:820px;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
    background:rgba(0,0,0,.32); padding:5px 14px; border-radius:99px; backdrop-filter:blur(8px);
  }
  .theme-toggle {
    position:fixed; top:44px; right:18px; z-index:60; display:flex; gap:0;
    background:rgba(18,18,20,.55); border:1px solid rgba(255,255,255,.12); border-radius:9px; overflow:hidden;
  }
  .theme-toggle button {
    border:none; background:transparent; color:rgba(255,255,255,.75); font-size:12px;
    padding:6px 12px; cursor:pointer;
  }
  .theme-toggle button.active { background:rgba(255,255,255,.9); color:#111; }

  /* ============ 预设按钮 ============ */
  .presets {
    position:fixed; left:20px; top:50%; transform:translateY(-50%); z-index:60;
    display:flex; flex-direction:column; gap:8px; width:215px;
  }
  .presets h4 { color:rgba(255,255,255,.65); font-size:11px; font-weight:600; letter-spacing:.08em; margin-bottom:2px; }
  .preset {
    border:1px solid rgba(255,255,255,.14); background:rgba(15,15,18,.5); backdrop-filter:blur(10px);
    color:#f0f0f2; text-align:left; font-size:12.5px; padding:8px 12px; border-radius:10px; cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .preset:hover { background:rgba(255,255,255,.14); }
  .preset:active { transform:scale(.98); }
  .preset .tag { color:rgba(255,255,255,.45); font-size:10.5px; display:block; margin-top:1px; }

  .tips {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:60;
    color:rgba(255,255,255,.8); font-size:12px; text-align:center;
    background:rgba(0,0,0,.3); padding:6px 16px; border-radius:99px; backdrop-filter:blur(8px);
  }

  /* ============ 描边图标（对齐 SF Symbols 质感） ============ */
  .icn {
    width:1.05em; height:1.05em; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
    vertical-align:-0.15em; flex:none;
  }
  .icn-big { width:30px; height:30px; stroke-width:1.4; display:block; margin:0 auto 8px; }

  /* ============ 面板（popover）============ */
  .panel {
    position:fixed; top:64px; right:3.5%; width:378px; z-index:40;
    background:var(--panel-bg);
    border-radius:13px; overflow:hidden;
    box-shadow:0 0 0 .5px rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.3);
    display:flex; flex-direction:column;
    max-height:calc(100vh - 100px);
  }
  .panel::before {
    content:""; position:absolute; top:-7px; right:56px; width:14px; height:14px;
    transform:rotate(45deg); background:var(--panel-bg); border-left:.5px solid rgba(0,0,0,.2); border-top:.5px solid rgba(0,0,0,.2);
  }

  /* 主题变量 */
  .panel[data-theme="light"] {
    --panel-bg:#f7f6f4; --text:#1d1d1f; --text2:#6e6e73; --text3:#a5a5aa;
    --field:rgba(20,20,22,.055); --hover:rgba(20,20,22,.055);
    --bar:#efeeec; --border:rgba(0,0,0,.09); --keycap:#ffffff;
  }
  .panel[data-theme="dark"] {
    --panel-bg:#242427; --text:#f0f0f3; --text2:#b8b8c0; --text3:#82828b;
    --field:rgba(255,255,255,.075); --hover:rgba(255,255,255,.065);
    --bar:#2c2c30; --border:rgba(255,255,255,.11); --keycap:#3a3a40;
  }
  /* 版本变量：品牌色 */
  .panel[data-version="A"] { --accent:#007aff; --accent-weak:rgba(0,122,255,.24); --accent-text:#007aff; }
  .panel[data-version="B"][data-theme="light"] { --accent:#d97706; --accent-weak:rgba(217,119,6,.15); --accent-text:#92400e; }
  .panel[data-version="B"][data-theme="dark"]  { --accent:#f5a623; --accent-weak:rgba(245,166,35,.24); --accent-text:#ffc35c; }
  .panel[data-version="C"][data-theme="light"] { --accent:#0d9488; --accent-weak:rgba(13,148,136,.14); --accent-text:#0f766e; }
  .panel[data-version="C"][data-theme="dark"]  { --accent:#2dd4bf; --accent-weak:rgba(45,212,191,.22); --accent-text:#5eead4; }
  .panel[data-version="D"] { --accent:#007aff; --accent-weak:rgba(0,122,255,.14); --accent-text:#007aff; }
  .panel[data-version="A"][data-theme="light"] { --panel-bg:#ececec; }

  /* ---- 顶栏 ---- */
  .topbar { display:flex; align-items:center; padding:10px 12px 8px; gap:8px; }
  .seg { display:flex; background:var(--field); border-radius:8px; padding:2px; gap:2px; }
  .seg button {
    border:none; background:transparent; color:var(--text2); font-size:12.5px; font-weight:600;
    padding:4px 16px; border-radius:6px; cursor:pointer; transition:all .18s;
    display:flex; align-items:center; gap:5px;
  }
  .seg button.active { background:var(--panel-bg); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .seg .badge {
    background:var(--accent); color:#fff; font-size:9.5px; font-weight:700; border-radius:8px;
    padding:0 5px; line-height:14px; display:none;
  }
  .seg .badge.on { display:inline-block; }
  .topbar .spacer { flex:1; }
  .iconbtn { border:none; background:transparent; color:var(--text2); cursor:pointer; font-size:14px; padding:4px 6px; border-radius:6px; }
  .iconbtn:hover { background:var(--hover); }

  /* ---- 搜索 ---- */
  .searchbar { display:none; padding:2px 12px 8px; }
  .searchbar.on { display:block; }
  .searchbar input {
    width:100%; border:none; outline:none; background:var(--field); color:var(--text);
    border-radius:7px; padding:6px 10px; font-size:13px;
  }

  /* ---- 输入区 ---- */
  .capture { padding:6px 12px 4px; }
  .capture-field-wrap {
    border-radius:9px; transition:box-shadow .18s, background .18s;
    background:var(--field);
  }
  .capture-field-wrap:focus-within { box-shadow:0 0 0 1.5px var(--accent); }
  .capture-field {
    outline:none; font-size:13.5px; line-height:1.5; color:var(--text);
    padding:7px 10px; min-height:34px; max-height:120px; overflow-y:auto;
    -webkit-user-modify:read-write-plaintext-only;
  }
  .capture-field:empty::before { content:attr(data-ph); color:var(--text3); pointer-events:none; }
  .mark-hl { border-radius:4px; padding:0 1px; font-weight:600; color:var(--accent-text); background:var(--accent-weak); }

  /* 识别提示：chip（B/C/D）vs 灰字行（A） */
  .hintrow { display:flex; align-items:center; gap:7px; padding:6px 12px 2px; min-height:26px; }
  .chip {
    display:none; align-items:center; gap:6px; font-size:12px;
    border:1.5px solid var(--accent); border-radius:99px; padding:3px 10px;
    color:var(--text2); background:var(--accent-weak);
    animation:chipIn .16s ease-out;
  }
  .chip.on { display:inline-flex; }
  .chip .ck-time { color:var(--accent); font-weight:700; }
  .chip .ck-x { border:none; background:transparent; color:var(--text3); cursor:pointer; font-size:11px; padding:0 0 0 2px; line-height:1; }
  .chip .ck-x:hover { color:var(--text); }
  .chip.past { border-color:var(--red,#e5484d); }
  .chip.past .ck-time { color:var(--red,#e5484d); }
  @keyframes chipIn { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:scale(1); } }
  /* A 版：无 chip 外形，退化为灰字 */
  .panel[data-version="A"] .chip { border:none; border-radius:0; padding:2.5px 0; color:var(--text2); font-weight:400; }
  .panel[data-version="A"] .chip .ck-time { font-weight:400; color:var(--text2); }
  .panel[data-version="A"] .mark-hl { border-radius:0; padding:0; font-weight:inherit; color:inherit; background:var(--accent-weak); }

  /* ---- 列表 ---- */
  .list { flex:1; overflow-y:auto; padding:4px 6px 10px; }
  .glabel {
    font-size:11px; color:var(--text3); margin:10px 8px 3px; letter-spacing:.02em; font-weight:600;
    display:flex; align-items:center; gap:5px;
  }
  .glabel.overdue { color:var(--red,#e5484d); }
  .glabel .chev { font-size:9px; cursor:pointer; }
  .glabel .cnt { font-weight:400; }
  .row {
    display:flex; align-items:flex-start; gap:9px; padding:7px 8px; border-radius:8px;
    transition:background .14s; position:relative; overflow:hidden;
  }
  .row:hover { background:var(--hover); }
  .row .rbody { flex:1; min-width:0; }
  .row .rtitle { font-size:13px; line-height:1.45; color:var(--text); word-break:break-word; }
  .row .rtime { font-size:11px; color:var(--text3); margin-top:1px; }
  .row .rtime.t-overdue { color:var(--red,#e5484d); }
  .row .rdel {
    border:none; background:transparent; color:var(--text3); cursor:pointer; font-size:12px;
    opacity:0; padding:2px 4px; border-radius:5px; transition:opacity .12s; margin-top:1px;
  }
  .row:hover .rdel { opacity:1; }
  .row .rdel:hover { color:var(--red,#e5484d); background:var(--hover); }

  /* 勾选 */
  .ckbox {
    width:16px; height:16px; border-radius:50%; border:1.5px solid var(--text3);
    flex:none; margin-top:2px; cursor:pointer; position:relative; transition:all .18s;
  }
  .ckbox:hover { border-color:var(--accent); }
  .ckbox.done { background:var(--accent); border-color:var(--accent); }
  .ckbox.done::after {
    content:"✓"; color:#fff; font-size:10px; font-weight:800; position:absolute;
    left:50%; top:50%; transform:translate(-50%,-52%) scale(1);
    animation:ckIn .18s ease-out;
  }
  @keyframes ckIn { from { transform:translate(-50%,-52%) scale(.4); opacity:0; } to { transform:translate(-50%,-52%) scale(1); opacity:1; } }
  .row .rtitle.done {
    color:var(--text3);
    background:linear-gradient(currentColor,currentColor) no-repeat left center / 100% 1px;
    animation:strike .3s ease-out;
  }
  @keyframes strike { from { background-size:0% 1px; } to { background-size:100% 1px; } }

  /* 新行入场 / 删除退场 */
  .row.enter { animation:rowIn .22s ease-out; }
  @keyframes rowIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  .row.leaving { transition:all .22s ease; opacity:0; }
  .row.flash { animation:flash 1s ease-out; }
  @keyframes flash { 0% { background:var(--accent-weak); } 100% { background:transparent; } }

  /* A 版：无动效、无 hover、行紧贴 */
  .panel[data-version="A"] * { transition:none !important; animation:none !important; }
  .panel[data-version="A"] .row:hover { background:transparent; }
  .panel[data-version="A"] .capture-field-wrap { background:transparent; box-shadow:none !important; border-radius:0; }
  .panel[data-version="A"] .row { padding:5px 6px; }
  .panel[data-version="A"] .seg button.active { background:var(--accent); color:#fff; box-shadow:none; }

  /* ---- 撤销底栏 ---- */
  .undobar {
    display:flex; align-items:center; gap:8px; padding:7px 12px 9px;
    background:var(--bar); border-top:.5px solid var(--border);
    position:relative; transform:translateY(100%); opacity:0;
    transition:transform .18s ease-out, opacity .18s ease-out, background .2s;
  }
  .undobar.on { transform:none; opacity:1; }
  .undobar .utext { font-size:12px; color:var(--text2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .undobar.recovered { background:color-mix(in srgb, var(--accent) 12%, var(--bar)); }
  .undobar .uaction {
    display:flex; align-items:center; gap:6px; border:none; cursor:pointer;
    color:var(--accent); font-size:12px; font-weight:600; background:transparent; padding:3px 6px; border-radius:6px;
  }
  .undobar .uaction:hover { background:var(--hover); }
  .keycap {
    background:var(--keycap); border:1px solid var(--border); border-radius:4px;
    font-size:10px; font-weight:600; color:var(--text2); padding:1px 5px;
    box-shadow:0 1px 0 var(--border); font-family:inherit;
  }
  .usub { font-size:10.5px; color:var(--text3); }
  .countdown { position:absolute; left:0; bottom:0; height:2px; width:100%; }
  .countdown i { display:block; height:100%; background:var(--accent); width:100%; border-radius:0 2px 2px 0; }
  /* A 版撤销条：朴素 */
  .panel[data-version="A"] .undobar { transform:none; opacity:1; display:none; }
  .panel[data-version="A"] .undobar.on { display:flex; }
  .panel[data-version="A"] .keycap, .panel[data-version="A"] .usub, .panel[data-version="A"] .countdown { display:none; }
  .panel[data-version="A"] .uaction { color:var(--accent); text-decoration:underline; }

  /* 空态 */
  .empty { text-align:center; color:var(--text3); font-size:12.5px; padding:44px 20px; line-height:1.8; }
  .empty .big { font-size:26px; margin-bottom:6px; }
</style>
</head>
<body>

<div class="menubar">
  <span></span>
  <div class="mb-right">
    <span>🔋</span><span>📶</span><span>🔍</span><span>09-29 周二</span>
    <span class="mb-shike"><svg class="icn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></svg> 拾刻 <span class="mb-count" id="mbCount">0</span></span>
  </div>
</div>

<div class="tabs">
  <button class="tab" data-v="A">A · 现状</button>
  <button class="tab" data-v="B">B · 琥珀（参考）</button>
  <button class="tab active" data-v="C">C · 青绿 ✓ 已选定</button>
  <button class="tab" data-v="D">D · 极简系统色</button>
</div>
<div class="tabdesc" id="tabdesc"></div>

<div class="theme-toggle">
  <button data-t="dark" class="active">🌙 深色</button>
  <button data-t="light">☀️ 浅色</button>
</div>

<div class="presets">
  <h4>演示预设（待办模式）</h4>
  <button class="preset" data-text="周五下午三点交报告">周五下午三点交报告<span class="tag">识别 → chip</span></button>
  <button class="preset" data-text="2分钟后提醒我喝水">2分钟后提醒我喝水<span class="tag">相对时间</span></button>
  <button class="preset" data-text="明天上午9点开会">明天上午9点开会<span class="tag">日期+时刻</span></button>
  <button class="preset" data-text="有两点需要注意">有两点需要注意<span class="tag">应不识别</span></button>
</div>

<div class="panel" data-version="B" data-theme="dark">
  <div class="topbar">
    <div class="seg">
      <button data-mode="note">便签</button>
      <button data-mode="todo" class="active">待办 <span class="badge" id="segBadge"></span></button>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="searchBtn" title="搜索"><svg class="icn" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg></button>
  </div>
  <div class="searchbar" id="searchBar">
    <input id="searchInput" placeholder="搜索便签和待办（Esc 关闭）">
  </div>
  <div class="capture">
    <div class="capture-field-wrap">
      <div class="capture-field" id="field" contenteditable="true" data-ph="记录一句话…"></div>
    </div>
  </div>
  <div class="hintrow"><span class="chip" id="chip"><svg class="icn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></svg><span class="ck-label" id="chipLabel"></span><button class="ck-x" id="chipX"><svg class="icn" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
  <div class="list" id="list"></div>
  <div class="undobar" id="undobar">
    <span class="utext" id="uText"></span>
    <span class="usub" id="uSub"></span>
    <button class="uaction" id="uBtn">撤销 <span class="keycap">⌘Z</span></button>
    <span class="countdown"><i id="cdBar"></i></span>
  </div>
</div>

<div class="tips">点预设或直接打字 → 回车提交 → 勾选完成 → 鼠标悬停行点 ✕ 删除 → 点「撤销」或按 ⌘Z；切换顶部版本与深浅色对比</div>

<script>
/* ================= 配置 ================= */
const VERSIONS = {
  A: { desc:"现状基线：系统默认灰 + 默认蓝，无动效；识别是淡蓝背景垫色，提示是灰色小字；撤销后无「已恢复」反馈。", recovered:false, countdown:false },
  B: { desc:"琥珀方案（参考）：结构与青绿版相同，仅品牌色为琥珀，供对比保留。", recovered:true, countdown:true },
  C: { desc:"青绿方案（已选定 ✓）：青绿品牌色 + Todoist 式识别药丸与 chip + Raycast 式底栏（撤销有「已恢复」反馈与倒计时）+ 全套动效 + 描边图标。", recovered:true, countdown:true },
  D: { desc:"极简系统色（参考）：结构与青绿版相同，但不引入品牌色，保持系统蓝，供对比保留。", recovered:true, countdown:true },
};

/* ================= 状态 ================= */
const state = {
  version: new URLSearchParams(location.search).get('version') || 'C',
  theme: 'dark',
  mode: 'todo',
  query: '',
  dismissed: false,
  undoStack: [],   // {kind:'note'|'todo', groupKey, item}
  seq: 1,
  todos: [],       // {id, title, time?, group:'overdue'|'today'|'later'|'nodate'|'done', done}
  notes: [],       // {id, title, timeLabel}
};

function seed() {
  const d = new Date();
  const yest = new Date(d.getTime() - 864e5);
  const hh = n => String(n).padStart(2, '0');
  state.todos = [
    { id:'t1', title:'交季度报表', group:'overdue', timeText:`昨天 17:00（已过）`, done:false },
    { id:'t2', title:'回复设计师邮件', group:'today', timeText:'今天 15:00', done:false },
    { id:'t3', title:'预约牙医', group:'today', timeText:'今天 18:30', done:false },
    { id:'t4', title:'买咖啡豆', group:'nodate', timeText:null, done:false },
    { id:'t5', title:'取快递', group:'done', timeText:null, done:true },
  ];
  state.notes = [
    { id:'n1', title:'周五晚会团建，记得带相机', timeLabel:'昨天' },
    { id:'n2', title:'网站改版想法：首页放三个使用场景，别放功能列表', timeLabel:'昨天' },
    { id:'n3', title:'读《卡片笔记写作法》第 3 章', timeLabel:'周一' },
  ];
}
seed();

/* ================= DOM ================= */
const panel = document.querySelector('.panel');
const field = document.getElementById('field');
const chip = document.getElementById('chip');
const chipLabel = document.getElementById('chipLabel');
const chipX = document.getElementById('chipX');
const listEl = document.getElementById('list');
const undobar = document.getElementById('undobar');
const uText = document.getElementById('uText');
const uSub = document.getElementById('uSub');
const uBtn = document.getElementById('uBtn');
const cdBar = document.getElementById('cdBar');
const mbCount = document.getElementById('mbCount');
const segBadge = document.getElementById('segBadge');

/* ================= 识别（演示级） ================= */
const RE = new RegExp([
  '(?<!有)(?:上午|下午|晚上|中午|凌晨)?\\s*[一两二三四五六七八九十半\\d]+\\s*点(?:半|[0-5]?\\d分)?',
  '\\d+\\s*(?:分钟|小时|秒钟|天)[之以]?后',
  '[一两二三四五六七八九十半]+\\s*(?:分钟|小时|秒钟|天)[之以]?后',
  '今[天晚晨]|明天|后天|昨天|大后天',
  '(?:下{1,2})?周[一二三四五六日天末]',
  '[01]?\\d月[0-3]?\\d[日号]',
  '[01]?\\d[日号]',
  '上午|下午|晚上|中午|凌晨',
].join('|'), 'g');

function recognize(text) {
  if (state.mode !== 'todo' || state.dismissed || !text.trim()) return null;
  const matches = [];
  RE.lastIndex = 0;
  let m;
  while ((m = RE.exec(text)) !== null) {
    if (m[0]) matches.push({ start:m.index, end:m.index + m[0].length });
  }
  if (!matches.length) return null;
  // 合并相邻（间隔仅空白）命中 → 一段
  const merged = [matches[0]];
  for (let i = 1; i < matches.length; i++) {
    const last = merged[merged.length - 1];
    const gap = text.slice(last.end, matches[i].start);
    if (gap.trim() === '') last.end = matches[i].end;
    else merged.push(matches[i]);
  }
  const span = merged.sort((a,b)=>b.end-a.start - (a.end-a.start))[0]; // 最长一段
  const spanText = text.slice(span.start, span.end);
  return { ...span, spanText, label: fakeResolve(spanText) };
}

function fakeResolve(s) {
  const now = new Date();
  const hh = n => String(n).padStart(2, '0');
  if (/分钟/.test(s)) {
    const n = parseInt(s) || 2;
    const t = new Date(now.getTime() + n * 6e4);
    return { main:`今天 ${hh(t.getHours())}:${hh(t.getMinutes())} 提醒`, suffix:`${n} 分钟后`, past:false };
  }
  if (/明天/.test(s)) {
    const hm = /(\d+)\s*点/.exec(s);
    const h = hm ? (/(下午|晚上)/.test(s) ? Math.min(parseInt(hm[1]) + 12, 23) : parseInt(hm[1])) : 9;
    return { main:`明天 ${hh(h)}:00 提醒`, suffix:null, past:false };
  }
  if (/周五|周[五]/.test(s)) {
    const hm = /(\d+)\s*点/.exec(s);
    const h = hm ? (/(下午|晚上)/.test(s) ? Math.min(parseInt(hm[1]) + 12, 23) : parseInt(hm[1])) : 15;
    return { main:`周五 ${hh(h)}:00 提醒`, suffix:null, past:false };
  }
  if (/[一两二三四五六七八九十半\d]+\s*点/.test(s)) {
    const hm = /([一两二三四五六七八九十半\d]+)\s*点/.exec(s);
    const map = {一:1,两:2,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,半:9};
    let h = parseInt(hm[1]); if (isNaN(h)) h = map[hm[1][0]] || 9;
    if (/(下午|晚上)/.test(s) && h < 12) h += 12;
    const t = new Date(now); t.setHours(h, 0, 0, 0);
    const past = t < now;
    return { main:`今天 ${hh(h)}:00 提醒`, suffix:null, past };
  }
  return { main:'已识别时间（演示）', suffix:null, past:false };
}

/* ================= 输入框高亮渲染（保光标） ================= */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function caretOffset() {
  const sel = getSelection();
  if (!sel.rangeCount || !field.contains(sel.anchorNode)) return null;
  const r = sel.getRangeAt(0).cloneRange();
  r.selectNodeContents(field); r.setEnd(getSelection().getRangeAt(0).startContainer, getSelection().getRangeAt(0).startOffset);
  return r.toString().length;
}
function setCaret(off) {
  const walker = document.createTreeWalker(field, NodeFilter.SHOW_TEXT);
  let n, acc = 0;
  while ((n = walker.nextNode())) {
    if (acc + n.length >= off) {
      const r = document.createRange(); r.setStart(n, off - acc); r.collapse(true);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); return;
    }
    acc += n.length;
  }
}
let lastHLKey = '';
function renderField() {
  const text = field.textContent;
  const rec = recognize(text);
  const off = caretOffset();
  const key = text + '|' + (rec ? rec.start + ':' + rec.end : 'x');
  if (key !== lastHLKey) {
    lastHLKey = key;
    if (rec) {
      field.innerHTML =
        esc(text.slice(0, rec.start)) +
        '<span class="mark-hl">' + esc(text.slice(rec.start, rec.end)) + '</span>' +
        esc(text.slice(rec.end));
    } else {
      field.textContent = text;
    }
    if (off !== null) setCaret(off);
  }
  if (rec) {
    chipLabel.innerHTML = `<span class="ck-time">${rec.label.main}</span>` + (rec.label.suffix ? ` <span style="opacity:.75">（${rec.label.suffix}）</span>` : '');
    chip.classList.toggle('past', rec.label.past);
    chip.classList.add('on');
  } else {
    chip.classList.remove('on');
  }
  return rec;
}
field.addEventListener('input', () => {
  if (field.textContent.trim() === '') state.dismissed = false; // 清空后恢复识别
  renderField();
});
field.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});

chipX.addEventListener('click', () => { state.dismissed = true; chip.classList.remove('on'); });

/* ================= 提交 ================= */
function submit() {
  const text = field.textContent.trim();
  if (!text) return;
  const rec = recognize(field.textContent);
  let title = text, timeText = null, group = 'nodate';
  if (rec) {
    title = (text.slice(0, rec.start) + text.slice(rec.end)).replace(/^[，。、\s"']+|[\s,，。、"']+$/g, '') || text;
    timeText = rec.label.main.replace(/ 提醒$/, '');
    group = rec.label.past ? 'overdue' : 'today';
  }
  if (state.mode === 'todo') {
    state.todos.unshift({ id:'s' + (state.seq++), title, group, timeText, done:false });
  } else {
    state.notes.unshift({ id:'sn' + (state.seq++), title, timeLabel:'刚刚' });
  }
  newId = state.mode === 'todo' ? 's' + (state.seq - 1) : 'sn' + (state.seq - 1);
  field.textContent = ''; lastHLKey = ''; state.dismissed = false;
  chip.classList.remove('on');
  renderList(newId);
}

/* ================= 列表渲染 ================= */
const GROUPS = [
  ['overdue','逾期'], ['today','今天'], ['later','以后'], ['nodate','无日期'], ['done','已完成'],
];
let doneOpen = false;
let newId = null;

function visible(t) {
  if (!state.query) return true;
  return (t.title || '').toLowerCase().includes(state.query.toLowerCase());
}

function renderList(flashId) {
  newId = flashId || null;
  listEl.innerHTML = '';
  const q = state.query;
  if (state.mode === 'note') {
    const notes = state.notes.filter(n => !q || n.title.toLowerCase().includes(q.toLowerCase()));
    if (!notes.length) return emptyState();
    notes.forEach(n => listEl.appendChild(noteRow(n)));
  } else {
    let any = false;
    GROUPS.forEach(([key, label]) => {
      let items = state.todos.filter(t => t.group === key && visible(t));
      if (!items.length) return;
      if (key === 'done' && !doneOpen) items = [];
      if (key === 'done' && !q) {
        const head = document.createElement('div');
        head.className = 'glabel';
        head.innerHTML = `<span class="chev" data-g="done">${doneOpen ? CHEV_D : CHEV_R}</span> 已完成 <span class="cnt">(${state.todos.filter(t=>t.group==='done').length})</span>`;
        head.querySelector('.chev').addEventListener('click', () => { doneOpen = !doneOpen; renderList(); });
        listEl.appendChild(head);
      } else if (!q) {
        const head = document.createElement('div');
        head.className = 'glabel' + (key === 'overdue' ? ' overdue' : '');
        head.textContent = label;
        listEl.appendChild(head);
      }
      items.forEach(t => { listEl.appendChild(todoRow(t)); any = true; });
    });
    if (!any && q) return emptyState();
    if (!any) return emptyState();
  }
  updateCount();
}

function emptyState() {
  const d = document.createElement('div');
  d.className = 'empty';
  d.innerHTML = state.mode === 'note'
    ? NOTE_BIG + '还没有便签<br>按 ⌥N 呼出面板，直接打字，回车保存'
    : TIMER_BIG + '还没有待办<br>试着输入「周五下午三点交报告」';
  listEl.appendChild(d);
  updateCount();
}

const X_SVG = '<svg class="icn" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const CHEV_R = '<svg class="icn" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>';
const CHEV_D = '<svg class="icn" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M5.5 9.5L12 16l6.5-6.5"/></svg>';
const NOTE_BIG = '<svg class="icn icn-big" viewBox="0 0 24 24"><path d="M7 3.5h6.8L19 8.7V20.5H7z" transform="translate(-1.5 0)"/><path d="M13 3.5v5.2h5"/><path d="M9.5 13.5h6M9.5 17h6"/></svg>';
const TIMER_BIG = '<svg class="icn icn-big" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.2"/><path d="M12 9.8v3.7l2.6 1.7"/><path d="M9.8 3h4.4"/></svg>';

function noteRow(n) {
  const row = document.createElement('div');
  row.className = 'row' + (n.id === newId ? ' enter flash' : '');
  row.innerHTML = `<div class="rbody"><div class="rtitle">${esc(n.title)}</div><div class="rtime">${n.timeLabel}</div></div><button class="rdel" title="删除">${X_SVG}</button>`;
  row.querySelector('.rdel').addEventListener('click', () => del('note', n, row));
  return row;
}

function todoRow(t) {
  const row = document.createElement('div');
  row.className = 'row' + (t.id === newId ? ' enter flash' : '');
  row.innerHTML = `
    <span class="ckbox ${t.done ? 'done' : ''}"></span>
    <div class="rbody">
      <div class="rtitle ${t.done ? 'done' : ''}">${esc(t.title)}</div>
      ${t.timeText ? `<div class="rtime ${t.group==='overdue' ? 't-overdue' : ''}">${t.timeText}</div>` : ''}
    </div>
    <button class="rdel" title="删除">${X_SVG}</button>`;
  row.querySelector('.ckbox').addEventListener('click', () => toggleTodo(t, row));
  row.querySelector('.rdel').addEventListener('click', () => del('todo', t, row));
  return row;
}

function toggleTodo(t, row) {
  if (t.done) {
    t.done = false; t.group = 'nodate';
    renderList();
    return;
  }
  t.done = true;
  renderList();              // 先呈现划线动画
  setTimeout(() => {
    t.group = 'done';
    renderList(t.id);        // 1 秒后移入已完成
  }, 1000);
}

/* ================= 删除与撤销 ================= */
let hideTimer = null;
function del(kind, item, rowEl) {
  const doRemove = () => {
    if (kind === 'todo') state.todos = state.todos.filter(x => x.id !== item.id);
    else state.notes = state.notes.filter(x => x.id !== item.id);
    state.undoStack.push({ kind, item });
    renderList();
    showBar(`已删除「${trunc(item.title)}」`, false);
  };
  if (VERSIONS[state.version].recovered) {
    rowEl.style.height = rowEl.offsetHeight + 'px';
    rowEl.offsetHeight; // reflow
    rowEl.classList.add('leaving');
    rowEl.style.height = '0'; rowEl.style.paddingTop = '0'; rowEl.style.paddingBottom = '0';
    setTimeout(doRemove, 230);
  } else {
    doRemove();
  }
}

function undo() {
  const last = state.undoStack.pop();
  if (!last) return;
  if (last.kind === 'todo') state.todos.unshift(last.item);
  else state.notes.unshift(last.item);
  renderList(last.item.id);
  if (VERSIONS[state.version].recovered) {
    const rest = state.undoStack.length;
    showBar(`已恢复「${trunc(last.item.title)}」 ✓`, true, rest ? `还可撤销 ${rest} 条` : '');
  } else {
    // 现状：无恢复反馈——栈非空则显示下一条删除，否则直接消失
    if (state.undoStack.length) showBar(`已删除「${trunc(state.undoStack[state.undoStack.length-1].item.title)}」`, false);
    else hideBar();
  }
}
uBtn.addEventListener('click', undo);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    if (getSelection().anchorNode && field.contains(getSelection().anchorNode)) return; // 输入框内交给文本撤销
    if (state.undoStack.length) { e.preventDefault(); undo(); }
  }
  if (e.key === 'Escape') { closeSearch(); }
});

function trunc(s){ s = s || ''; return s.length > 12 ? s.slice(0, 12) + '…' : s; }

function showBar(text, recovered, sub) {
  uText.textContent = text;
  uSub.textContent = sub || '';
  undobar.classList.add('on');
  undobar.classList.toggle('recovered', !!recovered && VERSIONS[state.version].recovered);
  clearTimeout(hideTimer);
  if (VERSIONS[state.version].countdown) {
    cdBar.style.transition = 'none'; cdBar.style.width = '100%';
    cdBar.offsetHeight;
    cdBar.style.transition = 'width 5s linear'; cdBar.style.width = '0%';
  }
  hideTimer = setTimeout(hideBar, 5000);
}
function hideBar() { undobar.classList.remove('on', 'recovered'); }

/* ================= 计数 ================= */
function updateCount() {
  const c = state.todos.filter(t => !t.done && (t.group === 'overdue' || t.group === 'today')).length;
  mbCount.textContent = c;
  mbCount.classList.toggle('on', c > 0);
  segBadge.textContent = c;
  segBadge.classList.toggle('on', c > 0);
}

/* ================= 模式切换 / 搜索 ================= */
document.querySelectorAll('.seg button').forEach(b => {
  b.addEventListener('click', () => setMode(b.dataset.mode));
});
function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  field.dataset.ph = m === 'note' ? '记录一句话…' : '添加待办，如：周五下午三点交报告';
  field.textContent = ''; lastHLKey = ''; state.dismissed = false;
  chip.classList.remove('on');
  renderList();
}

const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
document.getElementById('searchBtn').addEventListener('click', () => {
  searchBar.classList.toggle('on');
  if (searchBar.classList.contains('on')) searchInput.focus();
});
searchInput.addEventListener('input', () => { state.query = searchInput.value; renderList(); });
function closeSearch() {
  if (!searchBar.classList.contains('on')) return;
  searchBar.classList.remove('on'); searchInput.value = ''; state.query = ''; renderList();
}

/* ================= 预设 ================= */
let typeTimer = null;
document.querySelectorAll('.preset').forEach(b => {
  b.addEventListener('click', () => {
    setMode('todo');
    clearInterval(typeTimer);
    field.textContent = ''; lastHLKey = '';
    const text = b.dataset.text;
    let i = 0;
    field.focus();
    typeTimer = setInterval(() => {
      field.textContent += text[i++];
      renderField();
      if (i >= text.length) clearInterval(typeTimer);
    }, 55);
  });
});

/* ================= 版本与主题 ================= */
const descEl = document.getElementById('tabdesc');
function setVersion(v) {
  state.version = v;
  panel.dataset.version = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.v === v));
  descEl.textContent = VERSIONS[v].desc;
  hideBar(); renderList();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setVersion(t.dataset.v)));
document.querySelectorAll('.theme-toggle button').forEach(b => {
  b.addEventListener('click', () => {
    state.theme = b.dataset.t;
    panel.dataset.theme = state.theme;
    document.querySelectorAll('.theme-toggle button').forEach(x => x.classList.toggle('active', x === b));
  });
});

/* ================= 启动 ================= */
(() => {
  const qp0 = new URLSearchParams(location.search);
  if (qp0.get('theme') === 'light' || qp0.get('theme') === 'dark') {
    state.theme = qp0.get('theme');
    panel.dataset.theme = state.theme;
    document.querySelectorAll('.theme-toggle button').forEach(x => x.classList.toggle('active', x.dataset.t === state.theme));
  }
})();
setVersion(state.version);
renderList();
field.focus();

/* URL 参数自动演示（供截图/自查）：?demo=<文本>&delete=1&wait=<ms>&static=1 */
(() => {
  const qp = new URLSearchParams(location.search);
  if (qp.get('static') === '1') {
    const s = document.createElement('style');
    s.textContent = '*{transition:none!important;animation:none!important}';
    document.head.appendChild(s);
  }
  const demo = qp.get('demo');
  if (demo) {
    setMode('todo');
    let i = 0;
    const t = setInterval(() => {
      field.textContent += demo[i++];
      renderField();
      if (i >= demo.length) clearInterval(t);
    }, 40);
  }
  if (qp.get('delete') === '1') {
    setTimeout(() => {
      const row = listEl.querySelector('.row .rdel');
      if (row) row.click();
    }, parseInt(qp.get('wait') || '900', 10));
  }
})();
</script>
