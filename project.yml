name: Shike
options:
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true

packages:
  ShikeKit:
    path: Packages/ShikeKit

# 工程级设置：ad-hoc 签名（本地与 CI 相同）、不启用沙盒；
# 警告即错误由环境变量 SHIKE_WARNINGS_AS_ERRORS 控制，只在 CI 开启（stack.md）。
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "$(SHIKE_WARNINGS_AS_ERRORS:default=NO)"
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Shike:
    type: application
    platform: macOS
    sources:
      - path: Shike
      # 许可证原文随 App 打包，仓库中不另存副本（06 §9）
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: ShikeKit
        products:
          - ShikeData
          - ShikeDateParser
    settings:
      base:
        PRODUCT_NAME: Shike
        PRODUCT_BUNDLE_IDENTIFIER: io.github.micbik.shike
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: 拾刻
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (C) 2026 Shike contributors"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity

  ShikeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShikeTests
    dependencies:
      - target: Shike
      - package: ShikeKit
        products:
          - ShikeData
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Shike.app/Contents/MacOS/Shike
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Shike:
    build:
      targets:
        Shike: all
        ShikeTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-ShikeSimulateDatabaseOpenFailure YES": false
        "-ShikeSimulateWriteFailure YES": false
        "-ShikeDataDirectory /tmp/shike-dev": false
    test:
      config: Debug
      targets:
        - ShikeTests
      environmentVariables:
        - variable: SHIKE_TEST_HOST
          value: "1"
          isEnabled: true
